
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Funcionário | RH Connect</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/funcionario.js" defer></script>
</head>

<body>
    <main class="container my-4">
        <section class="card painel-funcionario p-3 p-md-4">

            <header class="cabecalho-funcionario d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h1>Área do Funcionário</h1>
                    <p id="boasVindas">Carregando...</p>
                </div>

                <button
                    type="button"
                    id="sair"
                    class="botao botao-login btn"
                >
                    Sair
                </button>
            </header>

            <section class="cartao-ponto mt-4">
                <h2>Meu ponto</h2>
                <p>Registre seus horários de trabalho.</p>

                <div class="botoes-ponto d-flex flex-wrap gap-2">
                    <button type="button" class="botao botao-login btn" id="entrada">
                        Registrar entrada
                    </button>

                    <button type="button" class="botao botao-login btn" id="inicioIntervalo">
                        Iniciar intervalo
                    </button>

                    <button type="button" class="botao botao-login btn" id="fimIntervalo">
                        Encerrar intervalo
                    </button>

                    <button type="button" class="botao botao-login btn" id="saida">
                        Registrar saída
                    </button>
                </div>

                <p id="mensagemPonto" role="status"></p>
            </section>

            <section class="cartao-banco-horas mt-4">
                <h2>Meu banco de horas</h2>

                <p class="rotulo-saldo">Saldo acumulado</p>
                <p id="saldoBancoHoras" class="valor-saldo">Carregando...</p>

                <button
                    type="button"
                    class="botao botao-login btn"
                    id="atualizarDados"
                >
                    Atualizar meus dados
                </button>

                <p id="mensagemBancoHoras" role="status"></p>
            </section>

            <section class="cartao-grafico mt-4">
                <h2>Horas trabalhadas</h2>

                <div class="grafico-funcionario">
                    <canvas id="graficoHorasTrabalhadas"></canvas>
                </div>
            </section>

            <section class="cartao-historico mt-4">
                <h2>Meu histórico de ponto</h2>

                <div class="table-responsive tabela-responsiva">
                    <table class="table table-striped table-hover align-middle tabela-funcionarios">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Registro</th>
                            </tr>
                        </thead>

                        <tbody id="historicoPonto">
                            <tr>
                                <td colspan="3">Carregando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="mensagemHistorico" role="status"></p>
            </section>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
