
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel RH | RH Connect</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/rh.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/rh.js" defer></script>
</head>

<body>
    <main class="container my-4">
        <section class="card painel-rh p-3 p-md-4">

            <h1>Painel da Gerência / RH</h1>

            <p id="boasVindas">
                Gerencie os funcionários da empresa.
            </p>

            <a href="cadastro.html" class="botao botao-login btn">
                + Cadastrar funcionário
            </a>

            <div class="gerenciar-funcionarios mt-4">
                <h2>Funcionários cadastrados</h2>

                <input
                    type="search"
                    id="pesquisaFuncionario"
                    class="form-control mb-3"
                    placeholder="Pesquisar por nome ou setor..."
                >

                <p id="totalFuncionarios"></p>

                <div class="table-responsive tabela-responsiva">
                    <table class="table table-striped table-hover align-middle tabela-funcionarios">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Setor</th>
                                <th>Banco de horas</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="listaFuncionarios"></tbody>
                    </table>
                </div>

                <p id="mensagemLista"></p>
            </div>

            <section id="detalhesFuncionario" hidden>
                <hr>

                <h2>Detalhes do funcionário</h2>

                <p id="nomeFuncionarioDetalhes"></p>
                <p id="saldoBancoHoras"></p>

                <h3>Horas trabalhadas por dia</h3>

                <div class="grafico-banco-horas">
                    <canvas id="graficoHorasTrabalhadas"></canvas>
                </div>

                <h3>Histórico de registros de ponto</h3>

                <div class="table-responsive tabela-responsiva">
                    <table class="table table-striped table-hover align-middle tabela-funcionarios">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Horário</th>
                                <th>Registro</th>
                            </tr>
                        </thead>

                        <tbody id="historicoPonto"></tbody>
                    </table>
                </div>

                <p id="mensagemDetalhes"></p>

                <button
                    type="button"
                    id="fecharDetalhes"
                    class="botao botao-login btn"
                >
                    Fechar detalhes
                </button>
            </section>

            <button
                type="button"
                id="sair"
                class="botao botao-login btn mt-3"
            >
                Sair
            </button>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
