
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar funcionário | RH Connect</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cadastro.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Cadastrar funcionário</h1>
            <p>Preencha os dados para criar o acesso do funcionário.</p>

            <form id="formCadastro">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome completo"
                    required
                >

                <label for="setor">Setor</label>
                <select id="setor" required>
                    <option value="">Selecione um setor</option>
                    <option value="RH">Recursos Humanos</option>
                    <option value="TI">Tecnologia da Informação</option>
                    <option value="Financeiro">Financeiro</option>
                    <option value="Vendas">Vendas</option>
                    <option value="Administrativo">Administrativo</option>
                </select>

                <p id="erroCadastro" class="mensagem-erro"></p>

                <button type="submit" class="botao">
                    Cadastrar funcionário
                </button>
            </form>

            <section id="resultadoCadastro" hidden>
                <h2>Cadastro realizado!</h2>
                <p>Guarde a senha temporária para entregá-la ao funcionário.</p>

                <label for="senhaTemporaria">Senha temporária</label>
                <input id="senhaTemporaria" type="text" readonly>

                <button type="button" id="copiarSenha" class="botao">
                    Copiar senha
                </button>

                <p id="avisoCopia"></p>
            </section>

            <p>
                <a href="rh.html">Voltar ao painel de RH</a>
            </p>
        </section>
    </main>
</body>
</html>
